[project]
name = "ecommerce-backend"
version = "0.1.0"
description = "E-commerce B2C Colombia — Backend API"
requires-python = ">=3.12"

dependencies = [
    # Web framework
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",

    # Validación y settings
    "pydantic>=2.7.0",
    "pydantic-settings>=2.3.0",

    # Base de datos
    "sqlalchemy>=2.0.0",
    "asyncpg>=0.29.0",          # Driver async para PostgreSQL
    "alembic>=1.13.0",

    # Cache
    "redis>=5.0.0",

    # Autenticación
    "python-jose[cryptography]>=3.3.0",   # JWT
    "bcrypt>=4.1.0",
    "python-multipart>=0.0.9",             # Form data

    # IA
    "google-generativeai>=0.7.0",          # Gemini API

    # Pagos
    "httpx>=0.27.0",                       # Cliente HTTP async (Wompi, Resend)

    # Emails
    "resend>=2.0.0",

    # Storage
    "supabase>=2.5.0",

    # Utilidades
    "python-slugify>=8.0.0",
    "pillow>=10.3.0",                      # Compresión de imágenes
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=5.0.0",
    "httpx>=0.27.0",               # TestClient de FastAPI
    "ruff>=0.4.0",
    "factory-boy>=3.3.0",          # Fixtures para tests
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]    
select = ["E", "F", "I", "N", "UP", "S", "B", "A"]
ignore = ["S101"]   # permite assert en tests

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
addopts = "--cov=app --cov-report=term-missing --cov-fail-under=80"
