services:
  auth_postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-auth_db}
      POSTGRES_USER: ${POSTGRES_USER:-auth_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-auth_password}
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - auth_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-auth_user} -d ${POSTGRES_DB:-auth_db}"]
      interval: 10s
      timeout: 5s
      retries: 5

  auth_service:
    build:
      context: .
      dockerfile: auth_service/Dockerfile
    restart: unless-stopped
    depends_on:
      auth_postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://auth_user:auth_password@auth_postgres:5432/auth_db}
      APP_NAME: ${APP_NAME:-Auth Service}
      DEBUG: ${DEBUG:-false}
      JWT_SECRET: ${JWT_SECRET:-change-this-secret}
      JWT_ALGORITHM: ${JWT_ALGORITHM:-HS256}
      JWT_EXPIRE_MINUTES: ${JWT_EXPIRE_MINUTES:-60}
    command: uvicorn auth_service.src.main:app --host 0.0.0.0 --port 8001
    ports:
      - "${AUTH_SERVICE_PORT:-8011}:8001"

volumes:
  auth_postgres_data:
