name: Backend CI

# Se ejecuta en cada push o PR a main que toque archivos del backend
on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/backend.yml"
  pull_request:
    branches: [main]
    paths:
      - "backend/**"

jobs:
  lint-and-test:
    name: Lint + Test
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: backend/pyproject.toml

      - name: Instalar dependencias
        working-directory: backend
        run: |
          pip install -e ".[dev]"

      - name: Lint — ruff check (errores de código)
        working-directory: backend
        run: ruff check .

      - name: Lint — ruff format (formato)
        working-directory: backend
        run: ruff format --check .

      - name: Tests + cobertura
        working-directory: backend
        env:
          # Variables mínimas para que la app arranque en tests
          DATABASE_URL: "postgresql+asyncpg://test:test@localhost/test"
          REDIS_URL: "redis://localhost:6379"
          SECRET_KEY: "test-secret-key-for-ci-only"
          GEMINI_API_KEY: "test-key"
          ENVIRONMENT: "test"
        run: |
          pytest --cov=app --cov-report=term-missing --cov-fail-under=80

  # Solo construye Docker en push a main (no en PRs)
  docker-build:
    name: Docker Build
    runs-on: ubuntu-latest
    needs: lint-and-test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Build imagen Docker
        working-directory: backend
        run: docker build -t ecommerce-backend:latest .

  # Deploy a Koyeb — solo en push a main después de que lint+test y docker pasen
  deploy:
    name: Deploy → Koyeb
    runs-on: ubuntu-latest
    needs: docker-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy a Koyeb
        # Por ahora es un placeholder — se configura cuando tengamos Koyeb listo
        run: echo "Deploy a Koyeb pendiente de configurar en Fase 8"
