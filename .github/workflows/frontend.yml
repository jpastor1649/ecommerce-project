name: Frontend CI

on:
  push:
    branches: [main]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend.yml"
  pull_request:
    branches: [main]
    paths:
      - "frontend/**"

jobs:
  lint-and-build:
    name: TypeCheck + Lint + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout código
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - name: Instalar dependencias
        working-directory: frontend
        run: npm ci

      - name: TypeScript — verificación de tipos
        working-directory: frontend
        run: npx tsc --noEmit

      - name: Lint — ESLint
        working-directory: frontend
        run: npm run lint

      - name: Build — next build
        working-directory: frontend
        env:
          # Variables mínimas para el build
          NEXT_PUBLIC_API_URL: "http://localhost:8000"
        run: npm run build

  # Deploy a Vercel — solo en push a main
  deploy:
    name: Deploy → Vercel
    runs-on: ubuntu-latest
    needs: lint-and-build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      - name: Deploy a Vercel
        # Vercel tiene su propia GitHub Integration automática
        # Este step es un placeholder — Vercel se configura desde su dashboard
        run: echo "Vercel despliega automáticamente vía GitHub Integration"
