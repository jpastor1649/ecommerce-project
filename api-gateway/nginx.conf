# ─── Rate Limiting Zones ──────────────────────────────────────────────────────
# General zone: 10 req/s per IP for all routes
limit_req_zone $binary_remote_addr zone=general:10m rate=10r/s;
# AI zone: stricter — 2 req/s per IP (AI calls are expensive)
limit_req_zone $binary_remote_addr zone=ai_zone:10m  rate=2r/s;

# ─── Cold-spare failover upstream (auth) ──────────────────────────────────────
upstream auth_backend {
    server ecommerce_auth_service:8001      max_fails=2 fail_timeout=5s;
    server ecommerce_auth_service_cold:8002 backup;
}

# ─── Request ID passthrough ───────────────────────────────────────────────────
map $http_x_request_id $req_id {
    ""      $request_id;
    default $http_x_request_id;
}

log_format gateway '$remote_addr - [$time_local] '
                   '"$request" $status $body_bytes_sent '
                   'rt=$request_time uct=$upstream_connect_time '
                   'urt=$upstream_response_time ust=$upstream_status '
                   'req_id=$req_id ua="$http_user_agent"';

# ─── HTTP server: redirect all traffic to HTTPS (Secure Channel Pattern) ──────
server {
    listen 8000;
    server_name _;
    return 301 https://$host:8443$request_uri;
}

# ─── HTTPS server (Secure Channel Pattern + Reverse Proxy Pattern) ────────────
server {
    listen 8443 ssl;
    server_name _;

    # TLS configuration (Secure Channel)
    ssl_certificate     /etc/nginx/certs/nginx.crt;
    ssl_certificate_key /etc/nginx/certs/nginx.key;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 10m;

    resolver 127.0.0.11 ipv6=off valid=10s;

    client_max_body_size 10m;

    proxy_connect_timeout 3s;
    proxy_send_timeout    10s;
    proxy_read_timeout    15s;

    access_log /var/log/nginx/access.log gateway;

    # ── CORS ────────────────────────────────────────────────────────────────
    set $cors_origin "";
    if ($http_origin = "http://localhost:3000") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "https://localhost:3000") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "http://localhost:3001") {
        set $cors_origin $http_origin;
    }
    if ($http_origin = "https://example.com") {
        set $cors_origin $http_origin;
    }

    add_header Access-Control-Allow-Origin      $cors_origin always;
    add_header Access-Control-Allow-Credentials true         always;
    add_header Access-Control-Allow-Methods     "GET, POST, PUT, PATCH, DELETE, OPTIONS" always;
    add_header Access-Control-Allow-Headers     "Authorization, Content-Type, X-Requested-With" always;
    add_header Access-Control-Max-Age           600          always;

    proxy_hide_header Access-Control-Allow-Origin;
    proxy_hide_header Access-Control-Allow-Credentials;
    proxy_hide_header Access-Control-Allow-Methods;
    proxy_hide_header Access-Control-Allow-Headers;

    # ── Security headers ────────────────────────────────────────────────────
    add_header X-Content-Type-Options  "nosniff"                         always;
    add_header X-Frame-Options         "DENY"                            always;
    add_header Referrer-Policy         "strict-origin-when-cross-origin" always;
    add_header X-Request-ID            $req_id                           always;
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    if ($request_method = OPTIONS) {
        return 204;
    }

    # ── Health check (no rate limit needed) ─────────────────────────────────
    location = /health {
        default_type application/json;
        return 200 '{"status":"ok","service":"api-gateway"}';
    }

    # ── Auth service (with cold-spare failover) ──────────────────────────────
    location /auth/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        proxy_pass         http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── User service ─────────────────────────────────────────────────────────
    location /users/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        set $upstream_user "user-service";
        proxy_pass         http://$upstream_user:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── Internal-only routes (subnet_b access control) ───────────────────────
    location /internal/ {
        allow 172.16.0.0/12;
        allow 192.168.0.0/16;
        allow 172.20.0.0/23;
        allow 127.0.0.1;
        deny all;

        set $upstream_user "user-service";
        proxy_pass         http://$upstream_user:8000;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── Product service ──────────────────────────────────────────────────────
    location /products/ {
        limit_req zone=general burst=20 nodelay;
        limit_req_status 429;

        set $upstream_product "product-service";
        proxy_pass         http://$upstream_product:8003;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── Order service ────────────────────────────────────────────────────────
    location = /orders {
        return 307 /orders/;
    }

    location /orders/ {
        limit_req zone=general burst=10 nodelay;
        limit_req_status 429;

        set $upstream_order "order-service";
        rewrite            ^/orders/(.*)$ /api/v1/orders/$1 break;
        proxy_pass         http://$upstream_order:8004;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── AI service — strict rate limiting (expensive LLM calls) ─────────────
    location = /ai {
        return 307 /ai/;
    }

    location /ai/ {
        # Stricter zone: 2 req/s, burst of 5, then return 429
        limit_req        zone=ai_zone burst=5 nodelay;
        limit_req_status 429;

        set $upstream_ai "ai-service";
        proxy_read_timeout 60s;
        rewrite            ^/ai/(.*)$ /api/v1/$1 break;
        proxy_pass         http://$upstream_ai:8005;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    # ── API docs (with cold-spare failover) ───────────────────────────────────
    location ~ ^/(docs|redoc|openapi.json) {
        proxy_pass         http://auth_backend;
        proxy_http_version 1.1;
        proxy_set_header   Connection        "";
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;
        proxy_set_header   X-Request-ID      $req_id;
    }

    location / {
        default_type application/json;
        return 404 '{"detail":"Route not mapped in api-gateway"}';
    }
}
